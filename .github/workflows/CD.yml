name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: cd-jacobo-vocos
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  desplegar:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el compose de esa publicacion
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Preparar el directorio en el servidor
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 3.81.225.222
          username: jacobo.vocos
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 2m
          script: mkdir -p "$HOME/app"

      - name: Copiar docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 3.81.225.222
          username: jacobo.vocos
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: docker-compose.yml
          target: /home/jacobo.vocos/app
          overwrite: true
          strip_components: 0

      - name: Actualizar los contenedores
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_TAG: v${{ github.event.workflow_run.run_number }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: 3.81.225.222
          username: jacobo.vocos
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 15m
          envs: IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -eu
            cd "$HOME/app"
            test -n "$IMAGE_TAG"
            test -n "$DOCKERHUB_USERNAME"
            test -n "$DOCKERHUB_TOKEN"
            printf 'IMAGE_TAG=%s\nDOCKERHUB_USERNAME=%s\n' "$IMAGE_TAG" "$DOCKERHUB_USERNAME" > .env
            if docker info >/dev/null 2>&1; then
              printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
              if docker compose version >/dev/null 2>&1; then
                docker compose pull
                docker compose up -d --force-recreate
                docker compose ps
              else
                docker-compose pull
                docker-compose up -d --force-recreate
                docker-compose ps
              fi
            else
              printf '%s' "$DOCKERHUB_TOKEN" | sudo docker login -u "$DOCKERHUB_USERNAME" --password-stdin
              if sudo docker compose version >/dev/null 2>&1; then
                sudo docker compose pull
                sudo docker compose up -d --force-recreate
                sudo docker compose ps
              else
                sudo docker-compose pull
                sudo docker-compose up -d --force-recreate
                sudo docker-compose ps
              fi
            fi
